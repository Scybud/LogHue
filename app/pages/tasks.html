<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks | LogHue</title>

    <!-- CSS LINKS (reuse dashboard CSS) -->
     <!--SCYBUD UI-->
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/variables.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/layout.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/components/sidebar/sidebar.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/components/buttons/nav-buttons.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/typography.css"
    />
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/animations.css">


    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/component.css" />
    <link rel="stylesheet" href="../css/tasks.css">
    <link rel="stylesheet" href="../css/components/tasks-calendar.css">
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/components/sidebar.css">
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/utilities.css" />
    <link rel="stylesheet" href="../css/components/forms.css">
        <link rel="stylesheet" href="../css/components/search.css">
        <link rel="stylesheet" href="../css/components/command-palette.css">
  <link rel="stylesheet" href="../css/components/tags.css">
<link rel="stylesheet" href="../css/components/onboarding.css">

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icons/favicons/favicon-32x32.png"
    />
  </head>

  <body>
    <!-- PRELOADER 
    <div class="preLoaderContainer">
      <div class="tt-wave-loader"><span></span><span></span><span></span></div>
      <div class="label">Log<span>Hue</span></div>
    </div>
    -->

    
    <main class="main">
      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebarContainer"></aside>
      
      <!-- MAIN CONTENT -->
      <article class="mainContent">

        <!-- HEADER -->
        <div class="contentHeader">
          <div class="headerLeft">
            <button class="menuBtn" id="toggleSidebar">
              <span class="menuIcon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M4 6H20M4 12H20M4 18H20"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                </svg>
              </span>
            </button>
            <h1 class="pageTitle">Tasks</h1>
          </div>
    
          <div class="headerRight">
            <button
              type="button"
              class="actionBtn"
              id="personalLogTaskOpen"
              title="Log Task"
            >
              <!-- Plus / Add Icon -->
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M12 5V19M5 12H19"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
    
            <button
            onclick="notificationsContainer.hidden ^= 1"
              id="notificationToggleBtn"
              title="Notifications"
              class="actionBtn"
            >
              <span id="notifBadge" class="badge">0</span>
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 22c1.1 0 2-.9 2-2H10c0 1.1.9 2 2 2z" />
                <path d="M18 16v-5a6 6 0 10-12 0v5l-1.5 2h15L18 16z" />
              </svg>
            </button>
    
            <div class="profileAvatarContainer">
              <img
                src="../assets/images/default_profile.png"
                alt="profile Image"
                class="profileAvatar"
              />
            </div>
          </div>
        </div>

        
        <div id="modalContainer"></div>
        <div id="actionsMessage"></div>
        <!--INFO DISPLAY-->
        <div id="infoDisplay"></div>

        <!--NOTIFICATIONS-->
        <div id="notificationsContainer" hidden>
          <h2>Notifications</h2>
          <ul id="notificationsList">
            <p class="placeholderText">Nothing here yet.</p>
          </ul>
        </div>

        <!-- PERSONAL LOG TASKS SECTION -->
        <section class="personalCreatedTasksContainer">

          <div class="taskViewControls">
            <div class="taskModeToggle" id="taskModeToggle">
              <button type="button" id="modeListBtn" class="active">List</button>
              <button type="button" id="modeCalendarBtn">Calendar</button>
            </div>
            <div class="taskViewPills" id="calendarViewPills" hidden>
              <button type="button" class="viewPill" data-view="year">Year</button>
              <button type="button" class="viewPill" data-view="month">Month</button>
              <button type="button" class="viewPill active" data-view="week">Week</button>
              <button type="button" class="viewPill" data-view="day">Day</button>
              <button type="button" class="viewPill" data-view="hour">Hour</button>
            </div>
            <div class="calendarNav" id="calendarNav" hidden>
              <div class="navBtns">
                <button type="button" id="calPrevBtn">‹</button>
                <button type="button" id="calNextBtn">›</button>
              </div>
              <span id="calendarRangeText">Week</span>
            </div>
            <div class="calendarClock" id="calendarClock" hidden>
              <span class="calendarClockDot"></span>
              <time id="calClockTime">--:--</time>
            </div>
          </div>

          <div id="personalCreatedTasks">
  <div class="taskGroup" id="incompleteGroup"></div>
  <div class="taskGroup" id="completedGroup"></div>
</div>

          <div id="personalTasksCalendar" hidden></div>

        </section>
      </article>
    </main>

    <!-- JS -->
    <script
    type="module"
    src="../js/utils/noAuthSessionProtect.js"
    ></script>
    <script type="module" src="../js/session.js" defer></script>
    <script type="module" src="../js/app.js" defer></script>
    <script type="module" src="../js/pages/tasks.js" defer></script>
    <script type="module">
      import { initCalendarView } from "../js/components/calendarView.js";
      window.addEventListener("DOMContentLoaded", initCalendarView);
    </script>

  </body>
</html>
