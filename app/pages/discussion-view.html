<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discussion | LogHue</title>

    <!--CSS LINKS (same as dashboard)-->
     <!--SCYBUD UI-->
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/variables.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/layout.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/components/sidebar/sidebar.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/components/buttons/nav-buttons.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/typography.css"
    />
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/animations.css">

    <!--APP SPECIFIC CSS-->
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/component.css" />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/utilities.css" />
    <link rel="stylesheet" href="../css/components/forms.css">
    <link rel="stylesheet" href="../css/components/search.css">
        <link rel="stylesheet" href="../css/components/command-palette.css">
<link rel="stylesheet" href="../css/components/sidebar.css">
<link rel="stylesheet" href="../css/discussion-view.css">

 <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icons/favicons/favicon-32x32.png"
    />
   
  </head>

  <body>
    <!--PRELOADER
    <div class="preLoaderContainer">
      <div class="tt-wave-loader"><span></span><span></span><span></span></div>
      <div class="label">Log<span>Hue</span></div>
    </div>
    -->

    
    <main class="main">
      <!-- SIDEBAR -->
      <aside class="sidebar" id="workspacePageSidebar"></aside>
      
      <div id="modalContainer"></div>
      <div id="actionsMessage"></div>
      <!-- MAIN CONTENT -->
      <!--INFO DISPLAY-->
      <div id="infoDisplay"></div>
      <article class="mainContent" id="discussionViewContent">
        <div class="discussionContent">

          <!--HEADER-->
          <div class="contentHeader">
          <div class="headerLeft">
            <button class="menuBtn" id="toggleSidebar">
              <span class="menuIcon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M4 6H20M4 12H20M4 18H20"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
              </span>
            </button>
    
            <h1 class="pageTitle">Discussion</h1>
          </div>
    
          <div class="headerRight">
           <button onclick="notificationsContainer.hidden ^= 1" id="notificationToggleBtn" title="Notifications" class="actionBtn">
                <span id="notifBadge" class="badge">0</span>
                <svg 
                width="20" 
                height="20" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                stroke-width="1.8" 
                stroke-linecap="round" 
                stroke-linejoin="round"
                >
                <path d="M12 22c1.1 0 2-.9 2-2H10c0 1.1.9 2 2 2z"/>
                <path d="M18 16v-5a6 6 0 10-12 0v5l-1.5 2h15L18 16z"/>
              </svg>
              
            </button>
    
    <div class="profileAvatarContainer">
              <img src="../assets/images/default_profile.png" alt="profile Image" class="profileAvatar">
            </div>
            
          </div>
        </div>
        
        <!--NOTIFICATIONS-->
        <div id="notificationsContainer" hidden>
          <h2>Notifications</h2>
          <ul id="notificationsList">
            <p class="placeholderText">Nothing here yet.</p>
          </ul>
        </div>

     <div class="mainContainer" style="display:flex; flex-direction:column; height:100%;">
  <!-- Header – JS fills this -->
  <section class="dcnHeader"></section>

  <!-- Chat area -->
  <section class="discussionCommentsSection">
    <div id="commentsFeed" class="commentsFeed">
      <!-- messages injected by JS -->
    </div>

    <!-- Chat input -->
    <div id="addCommentContainer" class="addcommentContainer">
      <div class="chatInputWrapper">
        <textarea
          id="commentInput"
          placeholder="Write a message..."
          rows="1"
        ></textarea>
        <button id="submitCommentBtn" class="primaryBtn" title="Send">
          <!-- send icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13"/>
            <path d="M22 2L15 22L11 13L2 9L22 2Z"/>
          </svg>
        </button>
      </div>
    </div>
  </section>
</div>

    </div>
    
         <section class="activitiesContainer" id="workspaceActivities">
        <div class="activitiesUpperSection">
          <p class="placeholderText">Stay updated every time.</p>
          <button class="reloadBtn btn btn-sm" title="reload page">
            <svg 
  width="20" 
  height="20" 
  viewBox="0 0 24 24" 
  fill="none" 
  stroke="currentColor" 
  stroke-width="1.8" 
  stroke-linecap="round" 
  stroke-linejoin="round"
>
  <path d="M3 12a9 9 0 0 1 15-6.7" />
  <polyline points="18 2 18 7 13 7" />
  <path d="M21 12a9 9 0 0 1-15 6.7" />
  <polyline points="6 22 6 17 11 17" />
</svg>
          </button>
        </div>

      </section>
      </article>
    </main>

    <!-- JS -->

    <script type="module" src="../js/utils/noAuthSessionProtect.js"></script>
    <script type="module" src="../js/session.js" defer></script>
    <script type="module" src="../js/app.js" defer></script>
    <script type="module" src="../js/pages/discussion-view.js" defer></script>
  </body>
</html>
