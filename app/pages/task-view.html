<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task | LogHue</title>

  <!--CSS LINKS-->

    <!--SCYBUD UI-->
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/variables.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/layout.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/components/sidebar/sidebar.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/components/buttons/nav-buttons.css"
    />
    <link
      rel="stylesheet"
      href="https://scybud.github.io/scybud-ui/css/typography.css"
    />
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/animations.css">
  


    <!--APP SPECIFIC CSS-->
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/component.css" />
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/utilities.css" />
  <link rel="stylesheet" href="../css/components/forms.css">
  <link rel="stylesheet" href="../css/components/search.css">
  <link rel="stylesheet" href="../css/components/command-palette.css">
  <link rel="stylesheet" href="../css/components/onboarding.css">
  <link rel="stylesheet" href="../css/components/sidebar.css">
<link rel="stylesheet" href="../css/components/focus-timer.css">
<link rel="stylesheet" href="../css/components/tags.css">
<link rel="stylesheet" href="../css/task-view.css">

 <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/icons/favicons/favicon-32x32.png"
    />

</head>

<body>
  <!--PRELOADER
  <div class="preLoaderContainer">
    <div class="tt-wave-loader"><span></span><span></span><span></span></div>
    <div class="label">Log<span>Hue</span></div>
  </div>
  -->
  
  <main class="main">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="taskSidebar"></aside>
    
    <!-- MAIN CONTENT -->
    <div id="modalContainer"></div>
    <div id="actionsMessage"></div>
    <!--INFO DISPLAY-->
    <div id="infoDisplay"></div>
    
    <article class="mainContent" id="taskViewContent">
      <div class="taskContents">
      <!--HEADER-->
      <div class="contentHeader">
        <div class="headerLeft">
          <button class="menuBtn" id="toggleSidebar">
            <span class="menuIcon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </span>
          </button>
    
          <h1 class="pageTitle">Task</h1>
        </div>
    
        <div class="headerRight">
          <button onclick="notificationsContainer.hidden ^= 1" id="notificationToggleBtn" title="Notifications" class="actionBtn">
            <span id="notifBadge" class="badge">0</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22c1.1 0 2-.9 2-2H10c0 1.1.9 2 2 2z" />
              <path d="M18 16v-5a6 6 0 10-12 0v5l-1.5 2h15L18 16z" />
            </svg>
    
          </button>
    
    <div class="profileAvatarContainer">
              <img src="../assets/images/default_profile.png" alt="profile Image" class="profileAvatar">
            </div>
            
          </div>
        </div>
        
        <!--NOTIFICATIONS-->
        <div id="notificationsContainer" hidden>
          <h2>Notifications</h2>
          <ul id="notificationsList">
            <p class="placeholderText">Nothing here yet.</p>
          </ul>
        </div>
        
      <div class="mainContainer">

        <!-- TASK HEADER -->
        <section class="taskHeader">
          <div class="taskHeaderTop">
            <h2 id="taskTitle">Task Title Placeholder</h2>

           <div class="taskActions">
 
        <button
          id="markTaskDoneBtn"
          class="iconBtn btn btn-sm"
          type="button"
          aria-label= "Mark task as completed"
          title="Mark completed"
        >
              
                <!-- check / complete icon -->
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                  <polyline points="22 4 12 14.01 9 11.01" />
                </svg>
             
        </button>

        <button
          id="editTaskBtn"
          class="iconBtn btn btn-sm"
          type="button"
          aria-label="Edit task"
          title="Edit task"
        >
          <!-- pencil icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
          </svg>
        </button>
     

  <button
    id="focusTimerBtn"
    class="iconBtn btn btn-sm"
    type="button"
    aria-label="Open focus timer"
    title="Focus timer"
  >
    <!-- timer / clock icon -->
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="13" r="8" />
      <path d="M12 9v4l2 2" />
      <path d="M9 2h6" />
    </svg>
  </button>
</div>
          </div>

          <div class="taskMeta">
            <div class="metaItem">
              <span class="metaLabel">Assigned To:</span>
              <div id="assignedMembers" class="avatarGroup"></div>
            </div>

            <div class="metaItem">
              <span class="metaLabel">Status:</span>
              <span id="taskStatus" class="statusBadge">in_progress</span>
            </div>

            <div class="metaItem">
              <span class="metaLabel">Created:</span>
              <span id="taskCreatedDate">--</span>
            </div>

            <div class="metaItem">
              <span class="metaLabel">Due Date:</span>
              <span id="taskDueDate">--</span>
            </div>
          </div>

          <p id="taskDescription" class="taskDescription">
            No description provided.
          </p>
        </section>

        <!-- LOGS FEED -->
        <section class="taskLogsSection">
          <h3>Logs</h3>
          <p class="sectionDescription">Updates from assigned members</p>

          <div id="logsFeed" class="logsFeed">
            <!-- Logs will be injected here -->
          </div>

          <!-- ADD LOG INPUT -->
          <div id="addLogContainer" class="addLogContainer">
            <textarea id="logInput" class="inputField" placeholder="Write an update..."></textarea>
            <button id="submitLogBtn" class="primaryBtn btn btn-sm">Submit Log</button>
          </div>
        </section>
      </div>

</div>
      <section class="activitiesContainer" id="workspaceActivities">
        <div class="activitiesUpperSection">
          <p class="placeholderText">Stay updated every time.</p>
          <button class="reloadBtn btn btn-sm" title="reload page">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 0 1 15-6.7" />
              <polyline points="18 2 18 7 13 7" />
              <path d="M21 12a9 9 0 0 1-15 6.7" />
              <polyline points="6 22 6 17 11 17" />
            </svg>
          </button>
        </div>

      </section>
    </article>
  </main>

  <!-- JS -->
  <script type="module" src="../js/utils/noAuthSessionProtect.js"></script>
  <script type="module" src="../js/session.js" defer></script>
  <script type="module" src="../js/app.js" defer></script>
  <script type="module" src="../js/pages/task-view.js" defer></script>
</body>

</html>
