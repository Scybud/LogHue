<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes | LogHue</title>

  <!--SCYBUD UI-->
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/variables.css" />
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/layout.css" />
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/components/sidebar/sidebar.css" />
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/components/buttons/nav-buttons.css" />
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/typography.css" />
  <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/animations.css">

  <!-- Quill CSS -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

  <!--APP SPECIFIC CSS-->
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/component.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/components/sidebar.css">
  <link rel="stylesheet" href="../css/utilities.css" />
  <link rel="stylesheet" href="../css/components/quill.css" />
  <link rel="stylesheet" href="../css/notes.css">
  <link rel="stylesheet" href="../css/components/forms.css">
  <link rel="stylesheet" href="../css/components/search.css">
  <link rel="stylesheet" href="../css/components/command-palette.css">

  <!--FAVICONS-->
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/favicons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicons/favicon-16x16.png" />
</head>

<body>
  <main class="main">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebarContainer"></aside>

    <!-- MAIN CONTENT -->
    <article class="mainContent" id="notesContent">
      <div class="contentHeader">
        <div class="headerLeft">
          <button class="menuBtn" id="toggleSidebar" aria-label="Toggle sidebar">
            <span class="menuIcon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </span>
          </button>
          <h1 class="pageTitle">Notes</h1>
        </div>

        <div class="headerRight">
          <button id="createNote" class="btn btn-sm actionBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Create Note
          </button>

          <button onclick="notificationsContainer.hidden ^= 1" id="notificationToggleBtn" title="Notifications" class="actionBtn" aria-label="Notifications">
            <span id="notifBadge" class="badge">0</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22c1.1 0 2-.9 2-2H10c0 1.1.9 2 2 2z" />
              <path d="M18 16v-5a6 6 0 10-12 0v5l-1.5 2h15L18 16z" />
            </svg>
          </button>

          <div class="profileAvatarContainer">
            <img src="../assets/images/default_profile.png" alt="Profile" class="profileAvatar">
          </div>
        </div>
      </div>

      <div id="modalContainer"></div>
      <div id="actionsMessage"></div>
      <div id="infoDisplay"></div>

      <div id="notificationsContainer" hidden>
        <h2>Notifications</h2>
        <ul id="notificationsList">
          <p class="placeholderText">Nothing here yet.</p>
        </ul>
      </div>

      <p class="danger"></p>

      <section class="notesContainer">
        <!-- LEFT: Notes List -->
        <div id="notesListContainer">
          <div class="sectionHeader">
            <div class="sectionHeaderLeft">
              <h2>All Notes</h2>
              <span id="notesCount" class="notesCount">0</span>
            </div>

            <button type="button" class="toggleNotesListBtn actionBtn" id="toggleNotesListBtn" aria-label="Toggle notes list" aria-expanded="false">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <line x1="4" y1="7" x2="14" y2="7" />
                <line x1="4" y1="12" x2="20" y2="12" />
                <line x1="4" y1="17" x2="14" y2="17" />
              </svg>
            </button>
          </div>

          <div id="notesList">
            <p class="placeholderText">No notes created yet.</p>
          </div>
        </div>

        <!-- RIGHT: Editor -->
        <div id="editorContainer">
          <!-- Dynamic content loads here -->
        </div>
      </section>
    </article>
  </main>

  <script type="module" src="../js/utils/noAuthSessionProtect.js"></script>
  <script type="module" src="../js/app.js" defer></script>
  <script type="module" src="../js/pages/notes.js" defer></script>

  <!-- Quill JS -->
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <!-- HTML TO PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <!-- HTML TO DOCX -->
  <script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js" defer></script>

  <script defer>
    const toggleNotesListBtn = document.getElementById("toggleNotesListBtn");
    const notesList = document.getElementById("notesList");

    toggleNotesListBtn?.addEventListener("click", () => {
      notesList.classList.toggle("expandList");
      const expanded = notesList.classList.contains("expandList");
      toggleNotesListBtn.setAttribute("aria-expanded", expanded);
    });
  </script>
</body>

</html>
