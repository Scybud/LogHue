<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | LogHue</title>

    <!--SCYBUD UI-->
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/variables.css" />
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/layout.css" />
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/components/sidebar/sidebar.css" />
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/components/buttons/nav-buttons.css" />
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/typography.css" />
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/animations.css" />

    <!--LOGHUE STYLES-->
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/component.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/utilities.css" />
    <link rel="stylesheet" href="../css/components/forms.css">
    <link rel="stylesheet" href="../css/components/search.css">
    <link rel="stylesheet" href="../css/components/command-palette.css">
    <link rel="stylesheet" href="../css/components/sidebar.css">
    <link rel="stylesheet" href="../css/components/onboarding.css">

    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/favicons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicons/favicon-16x16.png" />
    <link rel="manifest" href="../manifest.json" />
  </head>
  <body>

    <main class="main">

      <!-- SIDEBAR (Injected via JS) — untouched -->
      <aside class="sidebar" id="sidebarContainer">
        <div id="sidebarSkeleton" class="sidebarSkeleton">
          <div class="sidebarSkeletonNav">
            <div class="sidebarSkeletonItem">
              <span class="skeletonSidebarIcon"></span>
              <span class="skeletonSidebarText skeletonSidebarTextLong"></span>
            </div>
            <div class="sidebarSkeletonItem">
              <span class="skeletonSidebarIcon"></span>
              <span class="skeletonSidebarText skeletonSidebarTextMedium"></span>
            </div>
            <div class="sidebarSkeletonItem">
              <span class="skeletonSidebarIcon"></span>
              <span class="skeletonSidebarText skeletonSidebarTextShort"></span>
            </div>
            <div class="sidebarSkeletonItem">
              <span class="skeletonSidebarIcon"></span>
              <span class="skeletonSidebarText skeletonSidebarTextMedium"></span>
            </div>
            <div class="sidebarSkeletonItem">
              <span class="skeletonSidebarIcon"></span>
              <span class="skeletonSidebarText skeletonSidebarTextShort"></span>
            </div>
          </div>

          <div class="skeletonSidebarHeading"></div>

          <div class="sidebarSkeletonItem">
            <span class="skeletonSidebarIcon"></span>
            <span class="skeletonSidebarText skeletonSidebarTextMedium"></span>
          </div>
          <div class="sidebarSkeletonItem">
            <span class="skeletonSidebarIcon"></span>
            <span class="skeletonSidebarText skeletonSidebarTextShort"></span>
          </div>

          <div class="skeletonSidebarCreate"></div>

          <div class="sidebarSkeletonUser">
            <div class="skeletonSidebarAvatar"></div>
            <div class="skeletonSidebarUserInfo">
              <div class="skeletonSidebarUsername"></div>
              <div class="skeletonSidebarPlan"></div>
            </div>
          </div>
        </div>
      </aside>

      <!-- MAIN CONTENT VIEW -->
      <article class="mainContent" id="dashboardContent">

        <!-- HEADER -->
        <div class="contentHeader">
          <div class="headerLeft">
            <button class="menuBtn" id="toggleSidebar" aria-label="Toggle Sidebar">
              <span class="menuIcon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
              </span>
            </button>
          </div>

          <div class="headerRight">
            <button
              onclick="notificationsContainer.hidden ^= 1"
              id="notificationToggleBtn"
              title="Notifications"
              class="actionBtn"
              aria-label="Notifications"
            >
              <span id="notifBadge" class="badge">0</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22c1.1 0 2-.9 2-2H10c0 1.1.9 2 2 2z" />
                <path d="M18 16v-5a6 6 0 10-12 0v5l-1.5 2h15L18 16z" />
              </svg>
            </button>
          </div>
        </div>

        <!-- MESSAGES & NOTIFICATIONS OVERLAYS -->
        <div id="modalContainer"></div>
        <div id="actionsMessage"></div>
        <div id="infoDisplay"></div>

        <div id="notificationsContainer" hidden>
          <h2>Notifications</h2>
          <ul id="notificationsList">
            <p class="placeholderText">Nothing here yet.</p>
          </ul>
        </div>

        <!-- SECTION 1: DASHBOARD -->
        <section class="dashboard-section">

          <div class="dashboardTopRow">
            <div class="greetingBlock sectionHeader dashboardHeader">
              <div class="greetingLine">
                <h1 id="dashboardGreeting">Welcome back, </h1>
              </div>
              <p class="dateLine" id="dashboardDate"></p>
            </div>
            <div class="clockPill" id="dashboardClock">00:00:00</div>
          </div>

          <!--SEARCH CONTAINER-->
          <div class="searchBarContainer">
            <div class="searchInputWrapper">
              <svg class="searchIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
                <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
              <textarea name="mainSearchInput" id="mainSearchInput" class="inputField mainSearchInput" placeholder="Search workspaces, tasks..."></textarea>
              <kbd class="searchKbd">Ctrl K</kbd>
            </div>
            
          </div>

          <div id="MainSearchResults" class="mainSearchResultContainer"></div>

          <!-- CONSOLE GRID -->
          <div class="dashboardGrid" id="dashboardGrid">

            <section class="dPanel">
              <div class="dPanelHead">
                <h2>Today</h2>
                <span class="dPanelMeta" id="todayTaskMeta">0 open</span>
              </div>
              <ul class="dTaskList" id="todayTaskList">
                <p class="placeholderText">Loading…</p>
              </ul>
              <a href="tasks" class="dPanelFootLink">View all tasks →</a>
            </section>

            <section class="dPanel">
              <div class="dPanelHead">
                <h2>Recent notes</h2>
              </div>
              <ul class="dNoteList" id="recentNotesList">
                <p class="placeholderText">Loading…</p>
              </ul>
              <a href="notes" class="dPanelFootLink">View all notes →</a>
            </section>

            <section class="dPanel">
              <div class="dPanelHead">
                <h2>Workspaces</h2>
              </div>
              <ul class="dWsList" id="workspacesList">
                <p class="placeholderText">Loading…</p>
              </ul>
              <button class="dWsNewBtn createWorkspaceOpen">+ New workspace</button>
            </section>

          </div>

          <!-- STAT STRIP -->
          <div class="dashboardStats" id="dashboardStats"></div>

        </section>

      </article>
    </main>

    <!-- CORE SCRIPTS -->
    <script type="module" src="../js/utils/noAuthSessionProtect.js"></script>
    <script type="module" src="../js/session.js"></script>
    <script type="module" src="../js/app.js" defer></script>
    <script type="module" src="../js/pages/dashboard.js" defer></script>
    <script type="module" src="../js/utils/search.js" defer></script>
  </body>
</html>
