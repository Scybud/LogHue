<div class="modalContainer" id="inputContainer">
          <form class="personalLogInputContainer form">

             <!--CLOSE BUTTON-->
<svg 
class="closeModalBtn "
  xmlns="http://www.w3.org/2000/svg"
  width="22"
  height="22"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.7"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect
    x="3.5"
    y="3.5"
    width="17"
    height="17"
    rx="6"
    ry="6"
    fill="currentColor"
    opacity="0.06"
  />
  <path d="M9 9l6 6M15 9l-6 6" />
</svg>

            <h2>Create Task</h2>
            <label for="task">Task
              <span style="color: var(--danger);">*</span>
              <input
              placeholder="e.g. Fixed API bug"
              type="text"
              id="task"
              class="inputField"
              />
            </label>

            <label for="taskTime">Due Date
<span style="color: var(--danger);">*</span>

              <input type="datetime-local" id="taskTime" class="inputField" />
            </label>

            <label for="isRecurring">
              <input type="radio" name="taskType" id="isRecurring">

              Recurring task
            </label>

            <label for="isOneOff">
              <input type="radio" name="taskType" id="isOneOff" checked>

              Oneoff task
            </label>

            <label for="note">Note (Optional)

              <textarea
              id="note"
              placeholder="Add details about what you finished…"
              class="inputField textArea"
              ></textarea>
            </label>

            <button type="button" id="logTask" class="btn">Log Task</button>
          </form>
        </div>
