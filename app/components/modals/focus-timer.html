<div class="modalContainer">
<div id="focusTimerModal" class="form" role="dialog" aria-modal="true" aria-labelledby="focusTimerTaskTitle">

  <div class="modal-panel focus-timer-panel" id="focusTimerPanel">

    <div class="focus-timer-full">
      <header class="focus-timer-header">
        <span class="focus-timer-eyebrow" id="focusTimerContext">Personal task</span>
        <button type="button" class="modal-close" data-close-focus-timer aria-label="Close">&times;</button>
      </header>

      <h2 id="focusTimerTaskTitle" class="focus-timer-task-title">Untitled task</h2>

      <div class="focus-timer-ring-wrap">
        <svg class="focus-timer-ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="88" />
          <circle class="ring-progress" id="focusTimerRingProgress" cx="100" cy="100" r="88" />
        </svg>
        <div class="focus-timer-readout">
          <span id="focusTimerTime" class="focus-timer-time">00:00:00</span>
          <span id="focusTimerState" class="focus-timer-state">Ready</span>
        </div>
      </div>

      <div class="focus-timer-target-row">
        <label for="focusTimerTargetInput">Target</label>
        <input type="number" id="focusTimerTargetInput" min="5" max="180" step="2" value="25" />
        <span>min</span>
      </div>

      <div class="focus-timer-controls">
        <button type="button" id="focusTimerPrimaryBtn" class="btn btn-primary">Start</button>
        <button type="button" id="focusTimerStopBtn" class="btn btn-secondary" disabled>Stop &amp; log</button>
        <button type="button" id="focusTimerCancelBtn" class="btn btn-icon" disabled aria-label="Cancel">&#10005;</button>
        <button type="button" id="focusTimerMinimizeBtn" class="btn btn-icon" aria-label="Minimize">&#8211;</button>
      </div>

      <p class="focus-timer-today">
        Logged today on this task
        <strong id="focusTimerTodayTotal">0m</strong>
      </p>
    </div>

    <div class="focus-timer-compact" id="focusTimerCompact">
      <span class="compact-dot" aria-hidden="true"></span>
      <span class="compact-time" id="focusTimerCompactTime">00:00:00</span>
      <button type="button" class="compact-toggle" id="focusTimerCompactToggle" aria-label="Pause">&#10074;&#10074;</button>
      <button type="button" class="compact-expand" id="focusTimerCompactExpand" aria-label="Expand">&#10529;</button>
    </div>

  </div>
</div>
</div>
