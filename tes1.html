<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/dashboard.css">

<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: var(--bg);
    font-family: var(--font);
  }

  /* Toggle Button */
  #menuToggle {
    position: absolute;
    top: var(--space-md);
    right: var(--space-md);
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--color);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    transition: background .2s, border-color .2s;
  }

  #menuToggle:hover {
    background: var(--active);
    border-color: var(--primary);
  }

  /* Menu Panel */
  #menu {
    position: absolute;
    top: 70px;
    right: var(--space-md);
    width: 180px;
    padding: var(--space-md);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.15);

    animation: fadeIn .18s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Links */
  .menu-links a {
    padding: 10px 12px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--color);
    font-size: 14px;
    transition: background .15s, color .15s;
  }

  .menu-links a:hover {
    background: var(--hover);
    color: var(--primary);
  }
</style>
</head>

<body>

<button id="menuToggle" onclick="menu.hidden ^= 1">☰</button>

<aside id="menu" hidden>
  <nav class="menu-links">
    <a href="#">Home</a>
    <a href="#">Explore</a>
    <a href="#">Trending</a>
    <a href="#">Messages</a>
    <a href="#">Settings</a>
  </nav>
</aside>

</body>
</html>
