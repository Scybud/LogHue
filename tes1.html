<!DOCTYPE html>
<html>
<head>

          <!--SCYBUD UI-->
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/variables.css">
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/typography.css">
    <link rel="stylesheet" href="https://scybud.github.io/scybud-ui/css/animations.css">

    <!--APP SPECIFIC CSS-->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/dashboard.css">

<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  background-image: url("https://loghue.com/assets/images/loghue-logo");   
   font-family: inter;
  }

  /* Toggle Button */
  #menuToggle {
    position: absolute;
    top: var(--space-md);
    right: var(--space-md);
    width: 38px;
    height: 38px;
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--color);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    transition: background .2s, border-color .2s;
  }

  #menuToggle:hover {
    background: var(--active);
    border-color: var(--primary);
  }

  /* Menu Panel */
  #menu {
    position: absolute;
    top: 70px;
    right: var(--space-md);
    width: 180px;
    padding: var(--space-md) var(--space-sm);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.15);
z-index: 1;
    animation: fadeIn .18s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .menu-links {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  /* Links */
  .menu-links a {
    display: block;
    background: #111;
    padding: 10px 12px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--color);
    font-size: 14px;
    transition: background .15s, color .15s;
  }

  .menu-links a:hover {
    background: var(--hover-bg);
  }
.glass-card {
  background: linear-gradient(
    135deg,
    rgba(255,255,255,0.12),
    rgba(255,255,255,0.04)
  );

  backdrop-filter: blur(18px);

  border: 1px solid rgba(255,255,255,0.15);

  box-shadow:
    0 8px 32px rgba(0,0,0,0.25);
padding: 24px;
  border-radius: 24px;
}
</style>
</head>

<body>
<div style="text-align:center; margin:36px 0;">
  <a href="https://app.loghue.com"
     style="
       background:#1e88e5;
       color:#111;
       padding:14px 26px;
       border-radius:8px;
       text-decoration:none;
       font-size:15px;
       font-weight:700;
       display:inline-block;
       letter-spacing:0.2px;
     ">
    Open LogHue
  </a>
</div>

<button id="menuToggle" onclick="menu.hidden ^= 1">â˜°</button>

<aside id="menu" hidden>
  <nav class="menu-links">
    <a href="#">Home</a>
    <a href="#">Explore</a>
    <a href="#">Trending</a>
    <a href="#">Messages</a>
    <a href="#">Settings</a>
  </nav>
</aside>

<div class="glass-card">
  <h2>LogHue</h2>
  <p>Manage workspaces and tasks easily.</p>
</div>

</body>
</html>
